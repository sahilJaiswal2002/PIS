{% extends "base.html" %}

{% block title %}Register - IITB SCAN{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>🏥 IITB SCAN</h1>
            <p>Medical Data Collection System</p>
        </div>

        <form method="POST" class="auth-form">
            <h2>Create Account</h2>

            <div class="form-group">
                <label for="username">
                    <span>👤</span>
                    <span>Username</span>
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autofocus
                    placeholder="Choose a unique username"
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="email">
                    <span>📧</span>
                    <span>Email Address</span>
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    <span>🔐</span>
                    <span>Password</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Create a strong password"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Account →</button>

            <div class="auth-footer">
                <p>Already registered? <a href="{{ url_for('login') }}">Sign in here</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
