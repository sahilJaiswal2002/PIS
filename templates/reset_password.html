{% extends "base.html" %}

{% block title %}Reset Password - IITB SCAN{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>🏥SCAN IITB</h1>
            <p>Patient Data Collection</p>
        </div>

        <form method="POST" class="auth-form">
            <h2>Set New Password</h2>
            <p class="text-muted" style="margin-bottom: 24px; font-size: 14px;">Create a new password for your account.</p>

            <div class="form-group">
                <label for="password">
                    <span>🔐</span>
                    <span>New Password</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Enter new password (min. 6 characters)"
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    <span>🔐</span>
                    <span>Confirm Password</span>
                </label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">Reset Password →</button>

            <div class="auth-footer">
                <p>Remember your password? <a href="{{ url_for('login') }}">Back to Login</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
