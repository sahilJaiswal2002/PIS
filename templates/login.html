{% extends "base.html" %}

{% block title %}Login - IITB SCAN{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>🏥 IITB SCAN</h1>
            <p>Medical Data Collection System</p>
        </div>

        <form method="POST" class="auth-form">
            <h2>Welcome Back</h2>

            <div class="form-group">
                <label for="username">
                    <span>👤</span>
                    <span>Username</span>
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autofocus
                    placeholder="Enter your username"
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    <span>🔐</span>
                    <span>Password</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In →</button>

            <div class="auth-footer">
                <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
                <p class="text-muted">📌 Demo: username='admin' | password='admin123'</p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
